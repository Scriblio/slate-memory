[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slate-memory"
version = "1.0.1"
description = "MCP memory server with error-correcting attractor dynamics. Claude forgets everything — Slate fixes that."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Matthew Lancaster", email = "mattclancaster@gmail.com"},
]
keywords = ["llm", "memory", "rag", "attractor", "hopfield", "retrieval", "mcp", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=2.0"]
mcp = ["mcp>=1.0.0", "onnxruntime>=1.16.0", "sentence-transformers>=2.0"]

[project.urls]
Homepage = "https://github.com/Scriblio/slate-memory"
Documentation = "https://github.com/Scriblio/slate-memory#readme"

[tool.setuptools.packages.find]
include = ["slate_memory*"]
